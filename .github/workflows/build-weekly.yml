name: Build Docker Image Weekly

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  DEFAULT_PGVECTOR: "v0.8"
  DEFAULT_POSTGRES: "19"

jobs:
  build-and-push:
    name: Build pgvector ${{ matrix.pgvector }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18", "19"]
        pgvector: ["v0.8"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versions
        id: ver
        run: |
          IMAGE="postgres:${{ matrix.postgres }}-alpine3.24"
          docker pull -q "$IMAGE"
          PG_VERSION=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^PG_VERSION=//p')
          PGVECTOR_TAG=$(git ls-remote --tags --refs https://github.com/pgvector/pgvector.git "${{ matrix.pgvector }}.*" \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          echo "pg=${PG_VERSION:?failed to resolve PG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pgvector=${PGVECTOR_TAG:?failed to resolve PGVECTOR_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            PG_IMAGE=postgres:${{ steps.ver.outputs.pg }}-alpine3.24
            PGVECTOR_TAG=${{ steps.ver.outputs.pgvector }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.pgvector }}-pg${{ matrix.postgres }}
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.pgvector }}-pg${{ matrix.postgres }}
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.pgvector }}-pg${{ steps.ver.outputs.pg }}
            ${{ matrix.pgvector == env.DEFAULT_PGVECTOR && format('{0}:pg{1}', steps.image.outputs.name, matrix.postgres) || '' }}
            ${{ matrix.pgvector == env.DEFAULT_PGVECTOR && format('{0}:pg{1}', steps.image.outputs.name, steps.ver.outputs.pg) || '' }}
            ${{ matrix.pgvector == env.DEFAULT_PGVECTOR && matrix.postgres == env.DEFAULT_POSTGRES && format('{0}:latest', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.pgvector }}-pg${{ matrix.postgres }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pgvector }}-pg${{ matrix.postgres }}
